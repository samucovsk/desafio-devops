# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

pr:
- master

trigger:
- master


pool:
  vmImage: ubuntu-latest

steps:
- script: ./build_pr.bash
  workingDirectory: desafio
  
  env: 
    REPO: $(REPO)
    PASSWORD: $(PASSWORD)
    USERNAME: $(USERNAME)

  displayName: 'Somente build da imagem'
  condition: eq(variables['Build.Reason'], 'PullRequest')

- script: ./build.bash
  workingDirectory: desafio
  
  env: 
    REPO: $(REPO)
    PASSWORD: $(PASSWORD)
    USERNAME: $(USERNAME)

  displayName: "Build e push da imagem para o dockerhub"
  condition: eq(variables['Build.Reason'], 'IndividualCI')